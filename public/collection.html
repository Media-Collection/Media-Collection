<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/apiFetch.js"></script>
    <script src="js/sessao.js"></script>
    <script src="js/search.js"></script>
    <link rel="stylesheet" href="css/style_search.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <title>Search</title>
</head>

<body onload="search_id(), validarSessaoCollection()" class="search_main">
    <div class="button_line">
        <div id="left" class="left">
            <a href="index.html"><img class="logo" src="img\Logo v2.png" alt="logo"><a href="Home.html"></a>
                <a href="Search.html"><button class="films attached_button">Filmes</button></a>
                <!--                 <a href="collection.html"><button class="selected attached_button">My Collection</button></a>
                <button class="attached_button">Dashboard</button> -->
        </div>
        <div class="right">
            <button onclick="limparSessao()" class="selected basic_button"> Sair </button>
        </div>
        <input onkeyup="(event.key === 'Enter') ? (search_id(), pag_num = 1) : undefined;" type="text" id="ipt_filme"
            placeholder="Digite seu filme">
    </div>
    </div>
    <section class="center_column">
        <div class="add_box" style="display: none;" id="add_box">
            Título: ${Filme} <br>
            Data de Lançamento: ${data} <br>
            gênero: ${genero} <br><br>
        </div>
        <main class="movie_box" id="movie_box">
            <div class="poster_grid" id="msg">
                <div class="movie_div"> <img class="poster"> <label class="movie_title">Carregando...</label> </div>
            </div>
        </main>
        <div id="page_button"></div>
    </section>

    <!-- <button onclick="buscar()">Procurar o Filme</button><br><br> -->
</body>
<script>
    function page_change(pag) {
        pag_num = Number(pag)
        search_id()
    };

    function exibir(id) {
        let add_box = document.getElementById("add_box");

        if (add_box.style.display == "none") {
            add_box.style.display = "block";

            if (validarSessaoAddFilm()) {
                add_box.innerHTML = `
                    <b> Título: </b> ${titulos[id]} <br> <b> Data de Lançamento: </b> ${(data_lancamento[id])} </b> <br> <b> Gênero: </b> ${generos[id]} <br><br><br> 
                    <b> Data de Compra: </b> ${dt_compra[id]} <br>
                    <b> Valor da Compra: </b> R$${valor[id]} <br>
                    <b> Local de Compra: </b> ${local[id]} <br>
                    <b> Tipo de mídia: </b> ${midia[id]} <br><br>
                    <button class="selected" onclick="remover(${id_filme[id]})"> Remover da coleção </button> `
            } else {
                add_box.innerHTML = `<b> Você precisa estar logado para visualizar os filmes da sua coleção! </b>`
            }
        } else {
            add_box.style.display = "none";
        }
    };

    function remover(id){
        fetch("/movies/retirar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                idServer: sessionStorage.ID_USUARIO,
                filme_idServer: id,
            })
        })

            .then((resposta) => {
                if (resposta.ok) {
                    alert("Filme retirado da coleção com sucesso")
                    exibir(0)
                    search_id()
                }

                else{
                    alert("Erro ao remover o item da coleção, tente novamente")
                }
        })
    }

    let fullscreen = window.matchMedia("(display-mode: fullscreen)");

    fullscreen.addEventListener("change", (e) => {
        search_id()
    })

</script>

</html>
