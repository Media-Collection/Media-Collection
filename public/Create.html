<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/apiFetch.js"></script>
  <script src="js/sessao.js"></script>
  <link rel="stylesheet" href="css/style_search.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">
  <title>Search</title>
</head>

<body onload="validarSessaoFilm()" class="search_main">
  <div class="button_line">
    <div id="left" class="left">
      <a href="index.html"><img class="logo" src="img\Logo v2.png" alt="logo"><a href="Home.html"></a>
        <a href="Search.html"><button class="attached_button">Filmes</button></a>
    </div>
    <div id="right" class="right">
      <a href="login.html"><button class="basic_button"> Entrar </button></a>
      <a href="Create.html"><button class="create_account"> Criar Conta </button></a>
    </div>
  </div>
  <section class="center">
    <main class="login_box center">
      <div class="tv_message center">
        <label for=""> Acompanhe a coleção que você obteve. <br><br> Registre aquele filme que você tanto ama. </label>
      </div>
      <div class="cadastro">
        <label>Cadastre-se!</label>
        <section> E-mail: <br><input oninput="validarCadastro()" type="email" id="ipt_email" placeholder="E-mail"> </section>
        <section> Username: <br><input oninput="validarCadastro()" type="text" id="ipt_username" placeholder="Username"> </section>
        <section> Senha: <br><input oninput="validarSenha()" type="password" id="ipt_password" placeholder="Password"> </section>
        <section> Confirmação de Senha: <br><input oninput="validarSenha()" type="password" id="ipt_password2" placeholder="Confirm your Password">
        </section>
        <div class="erro" id="error_message"></div>
        <button class="signup" onclick="cadastrar()"> Cadastrar </button>
      </div>
    </main>
  </section>

</body>
<script>
  var valido = true;

  function cadastrar() {
    var username = ipt_username.value;
    var email = ipt_email.value;
    var senha = ipt_password.value;
    let confirmacao_senha = ipt_password2.value;

    if(valido){
      if (
      username == "" ||
      email == "" ||
      senha == "" ||
      confirmacao_senha == ""
    ) {
      error_message.innerHTML =
        "Todos os valores devem ser preenchidos";
    }
    else{
      // Enviando o valor da nova input
      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          nomeServer: username,
          emailServer: email,
          senhaServer: senha
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);

          if (resposta.ok) {
            error_message.innerHTML = '<b class="sucesso"> Cadastro realizado com sucesso! Redirecionando para tela de Login... </b>';
            
          setTimeout(() => {
            window.location = "login.html";
          }, 2000);

          } else {
            throw new Error("Email já cadastrado");
          }
        })
        .catch(function (erro) {
          console.log(erro);
          error_message.innerHTML += erro.message;
        });
    }
    }
  }

  function validarCadastro(){
    let email = ipt_email.value;
    let username =  ipt_username.value;
    error_message.innerHTML = '';

    
    if(email.indexOf("@") <= 0 || email.indexOf(".com") <= 0 || email.indexOf("@") > email.indexOf(".com")){
      error_message.innerHTML += "E-mail Inválido"
      valido = false;
    } 

    else {
      valido = true;
  }
}

function validarSenha(){
  let senha = ipt_password.value;
  let confirmacao_senha = ipt_password2.value;
  error_message.innerHTML = '';

  if(senha.length < 5){
      error_message.innerHTML = "Senha deve conter pelo menos 5 dígitos"
      valido = false;
  }

  else if(senha != confirmacao_senha){
      error_message.innerHTML = "Senhas não coincidem"
      console.log(senha)
      console.log(confirmacao_senha)
      valido = false;
  }

  else{
    error_message.innerHTML = ""
    valido = true;
  }
}
</script>

</html>
