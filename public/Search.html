<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/apiFetch.js"></script>
    <script src="js/sessao.js"></script>
    <script src="js/search.js"></script>
    <link rel="stylesheet" href="css/style_search.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <title>Search</title>
</head>

<body onload="search(), validarSessaoFilm()" class="search_main">
    <div class="button_line">
        <div id="left" class="left">
            <a href="index.html"><img class="logo" src="img\Logo v2.png" alt="logo"><a href="Home.html"></a>
                <a href="Search.html"><button class="films selected attached_button">Filmes</button></a>
                <!--                 <a href="collection.html"><button class="collection attached_button">My Collection</button></a>
                <button class="dash attached_button">Dashboard</button> -->
        </div>
        <div id="right" class="right">
            <a href="login.html"><button class="basic_button"> Entrar </button></a>
            <a href="Create.html"><button class="create_account"> Criar Conta </button></a>
        </div>
        <input onkeyup="(event.key === 'Enter') ? (search(), pag_num = 1) : undefined;" type="text" id="ipt_filme"
            placeholder="Digite seu filme">
    </div>
    </div>
    <section class="center_column">
        <div class="add_box" style="display: none;" id="add_box">
            Título: ${Filme} <br>
            Data de Lançamento: ${data} <br>
            gênero: ${genero} <br><br>
        </div>
        <main class="movie_box" id="movie_box">
            <div class="poster_grid" id="msg">
                <div class="movie_div"> <img class="poster"> <label class="movie_title">Carregando...</label> </div>
            </div>
        </main>
        <div id="page_button"></div>
    </section>
    </div>


    <!-- <button onclick="buscar()">Procurar o Filme</button><br><br> -->
</body>
<script>
    if (validarSessaoAddFilm()) {
        let up_buttons = document.getElementById("right");
        up_buttons.innerHTML = '<button onclick="limparSessao()" class="selected basic_button"> Sair </button>'
    }

    function exibir(id) {
        let add_box = document.getElementById("add_box");
        let date = new Date (resultado_filmes[id].dt_lancamento);

        if (add_box.style.display == "none") {
            add_box.style.display = "block";

            if (validarSessaoAddFilm()) {
                add_box.innerHTML = `
                    <b> Título: </b> ${resultado_filmes[id].titulo} <br> <b> Data de Lançamento: </b> ${(date.toLocaleDateString("pt-BR"))} <br> 
                    <b> Gênero:  </b> ${resultado_filmes[id].genero} <br><br><br> 
                     Data de Compra: <input type="date" id="ipt_data" min="2020-01-01" max="2027-12-31" value="${sessionStorage.LAST_DATE_USUARIO}"><br>
                    Valor da Compra: <input type="number" id="ipt_valor" value="${sessionStorage.LAST_VALUE_USUARIO}"><br>
                    Local de Compra: <select name="" id="ipt_local">
                        <option value="1">Sebo</option>
                        <option value="2">Bazar</option>
                        <option value="3">Outros</option>
                        <option value="4">Internet</option>
                        <option value="5">Presente</option>
                    </select><br>
                    Tipo de mídia: <select name="" id="ipt_midia">
                        <option value="1">DVD</option>
                        <option value="2">Blu-ray</option>
                        <option value="3">VHS</option>
                        <option value="4">4K UHD</option>
                        <option value="5">UMD</option>
                    </select><br><br>
                    <button class="selected" onclick="registrar(${resultado_filmes[id].idFilme})"> Adicionar à coleção </button> `
            } else {
                add_box.innerHTML = `<b> Você precisa estar logado para adicionar filmes à sua coleção </b>`
            }
        } else {
            add_box.style.display = "none";
        }
    };


    function registrar(id) {
        // Irá verificar se o filme está na sua coleção, e se não estiver exibir um botão para adiciona-lo.
        // Após clicar nele, um popup modal irá ser exibido solicitando as informações de data, valores, local de compra e mídia (no registrar).
        // poster.style

        //let filme = document.getElementById(id)
        let data = ipt_data.value;
        let valor = Number(ipt_valor.value);
        let local = ipt_local.value;
        let midia = ipt_midia.value;

        sessionStorage.LAST_DATE_USUARIO = data;
        sessionStorage.LAST_VALUE_USUARIO = valor;

        if(!data || !valor || !local || !midia){
            alert("Todos os valores devem ser preenchidos")
        }else{

        fetch("/movies/adicionar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                idServer: sessionStorage.ID_USUARIO,
                filmeServer: id,
                dataServer: data,
                valorServer: valor,
                localServer: ipt_local.value,
                midiaServer: ipt_midia.value
            })
        })

            .then((resposta) => {
                if (resposta.ok) {
                    alert(`Filme ${id} adicionado á coleção!`)
                    console.log("Filme adicionado!")
                    //last_local = local;
                    //last_midia = midia;
                    exibir(0)
                }
                else {
                    alert("Filme já está na sua coleção!")
                }
            })


    }
    };

    function page_change(pag) {
        pag_num = Number(pag)
        draw(resultado_filmes.length);
    };

    let fullscreen = window.matchMedia("(display-mode: fullscreen)");

    fullscreen.addEventListener("change", (e) => {
        search()
    })
</script>

</html>
