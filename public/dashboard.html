<script>
    function atualizar_graficos_genero() {
        let dados_genre = {
            labels: [],
            datasets: [{
                label: 'total',
                data: [],
                cutout: 35
            }]
        }

        fetch("/dados/genre", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                idServer: sessionStorage.ID_USUARIO,
            })
        })

            .then((resposta) => {
                if (resposta.ok) {
                    resposta.json().then(json => {
                        for (let i = 0; i < json.length; i++) {
                            dados_genre.labels.push(json[i].genero)
                            dados_genre.datasets[0].data.push(json[i].total)
                        }

                        const config = {
                            type: 'pie',
                            data: dados_genre,
                            options: {
                                responsive: true,
                                plugins: {
                                    legend: {
                                        position: 'top',
                                    },
                                    title: {
                                        display: true,
                                        text: 'Genres'
                                    }
                                }
                            },
                        };

                        let myChart = new Chart(
                            document.getElementById("genre_pie"),
                            config
                        )

                        myChart.update();
                    })
                }
            })
    }

    function atualizar_graficos_local() {
        let dados_local = {
            labels: [],
            datasets: [{
                label: 'total',
                data: [],
                cutout: 35
            }]
        }

        fetch("/dados/local_compra", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                idServer: sessionStorage.ID_USUARIO,
            })
        })

            .then((resposta) => {
                if (resposta.ok) {
                    resposta.json().then(json => {
                        for (let i = 0; i < json.length; i++) {
                            dados_local.labels.push(json[i].local)
                            dados_local.datasets[0].data.push(json[i].quantidade_local)
                        }

                        const config = {
                            type: 'pie',
                            data: dados_local,
                            options: {
                                responsive: true,
                                plugins: {
                                    legend: {
                                        position: 'top',
                                    },
                                    title: {
                                        display: true,
                                        text: 'Locais de Compra'
                                    }
                                }
                            },
                        };

                        let myChart = new Chart(
                            document.getElementById("buy_pie"),
                            config
                        )

                        myChart.update();
                    })
                }
            })
    }

    function atualizar_graficos_ano() {
        let dados_ano = {
            labels: [],
            datasets: [{
                label: 'total',
                data: [],
                backgroundColor: [],
                cutout: 35,
            }]
        }

        fetch("/dados/ano", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                idServer: sessionStorage.ID_USUARIO,
            })
        })

            .then((resposta) => {
                if (resposta.ok) {
                    resposta.json().then(json => {
                    let anos_70 = 0;
                    let anos_80 = 0;
                    let anos_90 = 0;
                    let anos_00 = 0;
                    let anos_10 = 0;
                    let anos_20 = 0;

                    for (let i = 0; i < json.length; i++) {
                        for (let quant = json[i].quantidade_ano; quant > 0; quant--) {
                            if (json[i].ano < 1980) {
                                anos_70 += 1
                            }
                            else if (json[i].ano < 1990) {
                                anos_80 += 1
                            }
                            else if (json[i].ano < 2000) {
                                anos_90 += 1
                            }
                            else if (json[i].ano < 2010) {
                                anos_00 += 1
                            }
                            else if (json[i].ano < 2020) {
                                anos_10 += 1
                            }
                            else {
                                anos_20 += 1
                            }
                        }
                    }

                    let decadas = ["Anos 70", "Anos 80", "Anos 90", "Anos 2000", "Anos 2010", "Anos 2020"];
                    let cor = [141, 203, 188];
                    const diff = 30;

                    for(let i = 0; i < decadas.length; i++){
                        let cor1 = `rgb(${cor[0]}, ${cor[1]}, ${cor[2]})`
                        dados_ano.datasets[0].backgroundColor.push(cor1)

                        cor[0] = cor[0] - diff
                        cor[1] = cor[1] - diff
                        cor[2] = cor[2] - diff
                    }
                    let cores = [];
                    
                    let quant_decada = [anos_70, anos_80, anos_90, anos_00, anos_10, anos_20]

                    dados_ano.labels = decadas
                    dados_ano.datasets[0].data = quant_decada

                const config = {
                    type: 'doughnut',
                    data: dados_ano,
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'top',
                            },
                            title: {
                                display: true,
                                text: 'Ano de lançamento'
                            }
                        }
                    },
                };

                let myChart = new Chart(
                    document.getElementById("year_pie"),
                    config
                )

                myChart.update();
            })
        }
    }
)}

    function atualizar_kpis() {
        let kpi = document.getElementById("kpi")

        fetch("/dados/kpi", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                idServer: sessionStorage.ID_USUARIO,
            })
        })

            .then((resposta) => {
                if (resposta.ok) {
                    resposta.json().then(json => {
                        let valor_medio = Number(json[0].valor_medio);
                        let quantidade_total = Number(json[0].quantidade_total)
                        let valor_total = Number(json[0].valor_total);

                        kpi.innerHTML = `Valor Total: R$${valor_total.toFixed(2)} <br>
                    Total de Filmes na coleção: ${quantidade_total} <br>
                    Média de preço por filme: R$${valor_medio.toFixed(2)}`
                    })
                }
            })
    }

    atualizar_kpis()


    if (validarSessaoAddFilm()) {
        let up_buttons = document.getElementById("right");
        up_buttons.innerHTML = '<button onclick="limparSessao()" class="selected basic_button"> Sair </button>'
    } else {
        window.location = "../login.html";
    }
</script>
