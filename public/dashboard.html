<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/apiFetch.js"></script>
    <script src="js/sessao.js"></script>
    <script src="js/search.js"></script>
    <link rel="stylesheet" href="css/style_search.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <title>Search</title>
</head>

<body onload="atualizar_graficos_genero(), atualizar_graficos_local(), atualizar_graficos_ano()" class="search_main">
    <div class="button_line">
        <div id="left" class="left">
            <a href="index.html"><img class="logo" src="img\Logo v2.png" alt="logo"><a href="Home.html"></a>
                <a href="Search.html"><button class="films attached_button">Films</button></a>
                <a href="collection.html"><button class="collection attached_button">My Collection</button></a>
                <a href="dashboard.html"><button class="selected dash attached_button">Dashboard</button></a>
        </div>
        <div id="right" class="right">
            <a href="login.html"><button class="basic_button"> Sign in </button></a>
            <a href="Create.html"><button class="create_account"> Create Account </button></a>
        </div>
    </div>
    </div>
    <section class="center_column">
        <main class="movie_box" id="movie_box">
            <div class="dashboard">
                <div id="kpi" class="kpi">
                    Valor Total: R$100.00 <br>
                    Total de Filmes na coleção: 250 <br>
                    Média de preço por filme: R$5.00
                </div>
                <div class="pie_graphs">
                    <div class="center gap">
                        <div class="graph_pie">
                            <canvas id="genre_pie"></canvas>
                        </div>
                        <div class="graph_pie">
                            <canvas id="buy_pie"></canvas>
                        </div>
                    </div>
                    <div class="center">
                        <div class="graph_pie">
                            <canvas id="year_pie"></canvas>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </section>
    </div>


    <!-- <button onclick="buscar()">Procurar o Filme</button><br><br> -->
</body>
<script>
    function atualizar_graficos_genero() {
        let dados_genre = {
            labels: [],
            datasets: [{
                label: 'total',
                data: [],
                cutout: 35
            }]
        }

        fetch("/dados/genre", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                idServer: sessionStorage.ID_USUARIO,
            })
        })

            .then((resposta) => {
                if (resposta.ok) {
                    resposta.json().then(json => {
                        for (let i = 0; i < json.length; i++) {
                            dados_genre.labels.push(json[i].genero)
                            dados_genre.datasets[0].data.push(json[i].total)
                        }

                        const config = {
                            type: 'pie',
                            data: dados_genre,
                            options: {
                                responsive: true,
                                plugins: {
                                    legend: {
                                        position: 'left',
                                    },
                                    title: {
                                        display: true,
                                        text: 'Genres',
                                        fullSize: false,
                                        color: '#000000',
                                        font: {
                                            size: 25,
                                            family: 'sans-serif',
                                            weight: 'bold'
                                        }

                                    }
                                }
                            },
                        };

                        let myChart = new Chart(
                            document.getElementById("genre_pie"),
                            config
                        )

                        myChart.update();
                    })
                }
            })
    }

    function atualizar_graficos_local() {
        let dados_local = {
            labels: [],
            datasets: [{
                label: 'total',
                data: [],
                cutout: 35
            }]
        }

        fetch("/dados/local_compra", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                idServer: sessionStorage.ID_USUARIO,
            })
        })

            .then((resposta) => {
                if (resposta.ok) {
                    resposta.json().then(json => {
                        for (let i = 0; i < json.length; i++) {
                            dados_local.labels.push(json[i].local)
                            dados_local.datasets[0].data.push(json[i].quantidade_local)
                        }

                        const config = {
                            type: 'pie',
                            data: dados_local,
                            options: {
                                responsive: true,
                                plugins: {
                                    legend: {
                                        position: 'right',
                                    },
                                    title: {
                                        display: true,
                                        text: 'Locais de Compra',
                                        color: '#000000',
                                        font: {
                                            size: 25,
                                            family: 'sans-serif',
                                            weight: 'bold'
                                        }
                                    }
                                }
                            },
                        };

                        let myChart = new Chart(
                            document.getElementById("buy_pie"),
                            config
                        )

                        myChart.update();
                    })
                }
            })
    }

    function atualizar_graficos_ano() {
        let dados_ano = {
            labels: [],
            datasets: [{
                label: 'total',
                data: [],
                backgroundColor: [],
                cutout: 35,
                borderColor: '#000000',
                borderWidth: 2
            }]
        }

        fetch("/dados/ano", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                idServer: sessionStorage.ID_USUARIO,
            })
        })

            .then((resposta) => {
                if (resposta.ok) {
                    resposta.json().then(json => {

                        // Mudança de cor dinâmica
                        let cor = [141, 203, 188];
                        const diff = 30;

                        for (let i = 0; i < json.length; i++) {
                            let cor1 = `rgb(${cor[0]}, ${cor[1]}, ${cor[2]})`
                            dados_ano.datasets[0].backgroundColor.push(cor1);

                            cor[0] = cor[0] - diff
                            cor[1] = cor[1] - diff
                            cor[2] = cor[2] - diff

                            dados_ano.labels.push(json[i].ano)
                            dados_ano.datasets[0].data.push(json[i].quantidade_ano)
                        }


                        const config = {
                            type: 'doughnut',
                            data: dados_ano,
                            options: {
                                responsive: true,
                                plugins: {
                                    legend: {
                                        position: 'bottom',
                                    },
                                    title: {
                                        display: true,
                                        text: 'Ano de lançamento',
                                        fullSize: false,
                                        color: '#000000',
                                        font: {
                                            size: 25,
                                            family: 'sans-serif',
                                            weight: 'bold'
                                        }
                                    }
                                }
                            },
                        };

                        let myChart = new Chart(
                            document.getElementById("year_pie"),
                            config
                        )

                        myChart.update();
                    })
                }
            }
            )
    }

    function atualizar_kpis() {
        let kpi = document.getElementById("kpi")

        fetch("/dados/kpi", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                idServer: sessionStorage.ID_USUARIO,
            })
        })

            .then((resposta) => {
                if (resposta.ok) {
                    resposta.json().then(json => {
                        let valor_medio = Number(json[0].valor_medio);
                        let quantidade_total = Number(json[0].quantidade_total)
                        let valor_total = Number(json[0].valor_total);

                        kpi.innerHTML = `Valor Total: R$${valor_total.toFixed(2)} <br>
                    Total de Filmes na coleção: ${quantidade_total} <br>
                    Média de preço por filme: R$${valor_medio.toFixed(2)}`
                    })
                }
            })
    }

    atualizar_kpis()


    if (validarSessaoAddFilm()) {
        let up_buttons = document.getElementById("right");
        up_buttons.innerHTML = '<button onclick="limparSessao()" class="selected basic_button"> Sair </button>'
    } else {
        window.location = "../login.html";
    }
</script>

</html>
